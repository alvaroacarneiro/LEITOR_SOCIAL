<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Clubes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-book"></i> Leitor Social
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm me-1">
                    <i class="bi bi-house"></i> Início
                </a>
                <a href="groups.html" class="btn btn-light btn-sm">
                    <i class="bi bi-people"></i> Clubes
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-people"></i> Meus Clubes de Leitura</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">
                <i class="bi bi-plus-circle"></i> Criar Clube
            </button>
        </div>

        <!-- Lista de grupos -->
        <div id="groups-list" class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col-12 text-center text-muted">Carregando...</div>
        </div>
    </div>

    <!-- Modal de criar grupo -->
    <div class="modal fade" id="createGroupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Criar Clube de Leitura</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-group-form">
                        <div class="mb-3">
                            <label class="form-label">Nome do Clube *</label>
                            <input type="text" class="form-control" id="group-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" id="group-description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Código de Convite (opcional)</label>
                            <input type="text" class="form-control" id="group-join-code" placeholder="Deixe em branco para gerar automaticamente">
                            <small class="text-muted">Compartilhe este código para que outros possam entrar.</small>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="group-private">
                            <label class="form-check-label" for="group-private">Clube privado (apenas por convite)</label>
                        </div>
                        <div id="group-create-error" class="text-danger mb-2"></div>
                        <button type="submit" class="btn btn-primary w-100">Criar Clube</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de entrar em grupo -->
    <div class="modal fade" id="joinGroupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Entrar em um Clube</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Código de Convite</label>
                        <input type="text" class="form-control" id="join-code-input" placeholder="Ex: ABC12345">
                    </div>
                    <div id="join-error" class="text-danger mb-2"></div>
                    <button class="btn btn-success w-100" id="join-group-btn">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        // ============================================================
        // CARREGAR GRUPOS DO USUÁRIO
        // ============================================================
        async function loadGroups() {
            const container = document.getElementById('groups-list');
            try {
                const res = await fetch('../api/groups.php', { credentials: 'include' });
                const data = await res.json();
                if (data.error) {
                    container.innerHTML = `<div class="col-12 text-danger">${data.error}</div>`;
                    return;
                }
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center text-muted py-5">
                            <i class="bi bi-people" style="font-size: 3rem;"></i>
                            <p class="mt-3">Você não está em nenhum clube ainda.</p>
                            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createGroupModal">
                                <i class="bi bi-plus-circle"></i> Criar seu primeiro clube
                            </button>
                            <button class="btn btn-outline-secondary btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#joinGroupModal">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar com código
                            </button>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = data.map(group => `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${group.name}</h5>
                                <p class="card-text small text-muted">${group.description || 'Sem descrição'}</p>
                                <div class="d-flex gap-2 mb-2">
                                    <span class="badge bg-secondary"><i class="bi bi-people"></i> ${group.member_count || 0}</span>
                                    <span class="badge bg-info"><i class="bi bi-book"></i> ${group.book_count || 0}</span>
                                    ${group.is_member ? `<span class="badge bg-success">Membro</span>` : ''}
                                </div>
                                <p class="small text-muted">Criado por ${group.creator_name}</p>
                            </div>
                            <div class="card-footer bg-transparent">
                                <a href="group.html?id=${group.id}" class="btn btn-primary btn-sm w-100">Ver Clube</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="col-12 text-danger">Erro: ${e.message}</div>`;
            }
        }

        // ============================================================
        // CRIAR GRUPO
        // ============================================================
        document.getElementById('create-group-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('group-name').value.trim();
            const description = document.getElementById('group-description').value.trim();
            const joinCode = document.getElementById('group-join-code').value.trim();
            const isPrivate = document.getElementById('group-private').checked;

            if (!name) {
                document.getElementById('group-create-error').textContent = 'Nome é obrigatório.';
                return;
            }

            try {
                const res = await fetch('../api/groups.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        action: 'create',
                        name,
                        description,
                        is_private: isPrivate,
                        join_code: joinCode || null
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    bootstrap.Modal.getInstance(document.getElementById('createGroupModal')).hide();
                    loadGroups();
                } else {
                    document.getElementById('group-create-error').textContent = data.error;
                }
            } catch (e) {
                document.getElementById('group-create-error').textContent = 'Erro de conexão.';
            }
        });

        // ============================================================
        // ENTRAR EM GRUPO POR CÓDIGO
        // ============================================================
        document.getElementById('join-group-btn').addEventListener('click', async function() {
            const code = document.getElementById('join-code-input').value.trim();
            if (!code) {
                document.getElementById('join-error').textContent = 'Digite o código de convite.';
                return;
            }
            try {
                const res = await fetch('../api/groups.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ action: 'join', join_code: code })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    bootstrap.Modal.getInstance(document.getElementById('joinGroupModal')).hide();
                    loadGroups();
                } else {
                    document.getElementById('join-error').textContent = data.error;
                }
            } catch (e) {
                document.getElementById('join-error').textContent = 'Erro de conexão.';
            }
        });

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadGroups);
    </script>
</body>
</html>
